plugins { id 'com.android.application' }
android {
 namespace 'app.slink.garden'
 compileSdk 36
 defaultConfig { applicationId 'app.slink.garden'; minSdk 27; targetSdk 35; versionCode 13; versionName '0.1.12-test' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
}

tasks.register('syncWebAssets', Sync) {
 from('../../public') { include 'gartenstudio.html','gartenstudio.css','gartenstudio.js','slink.html','slink.css','slink.js','slink-levels.js','slink-fence-levels.js','slink-design.js','completion-settings.js','touch-settings.js','game-prewarm.js','ad-policy.js','game-economy.js','win-portrait.js','game-completion.js','menu-shell.js','*.webp','slink-world-3d.js','ivory-controls.js','ivory-controls.css','game-ivory-controls.js','game-ivory-controls.css','*.png' }
 from('../../THIRD_PARTY_THREE_LICENSE.txt')
 into(layout.buildDirectory.dir('generated/webAssets'))
}
tasks.named('preBuild').configure { dependsOn('syncWebAssets') }
